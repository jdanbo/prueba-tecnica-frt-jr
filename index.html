<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaTech | Catálogo</title>
  <meta name="description" content="Catálogo de NovaTech: audio, periféricos, pantallas y accesorios de tecnología. Busca por nombre y filtra por categoría." />
  <meta name="author" content="NovaTech" />

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <div class="brand">
        <span class="brand__logo" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg>
        </span>
        <h1 class="brand__name">NovaTech</h1>
      </div>

      <div class="header__tools">
        <form class="filters" role="search" aria-label="Buscar y filtrar productos">
          <div class="search">
            <svg class="search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label for="buscador" class="visually-hidden">Buscar producto</label>
            <input id="buscador" class="search__input" type="search" placeholder="Buscar producto..." autocomplete="off" />
          </div>

          <div class="select">
            <label for="categoria" class="visually-hidden">Categoría</label>
            <select id="categoria" class="select__field">
              <option value="todas">Todas las categorías</option>
            </select>
            <svg class="select__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </form>

        <div class="cart">
          <button id="carrito-btn" class="cart__btn" type="button" aria-expanded="false" aria-controls="carrito-menu" aria-label="Carrito, 0 productos">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .6h9.2a1 1 0 0 0 1-.8L21 7H6"/></svg>
            <span id="carrito-contador" class="cart__count" hidden>0</span>
          </button>

          <div id="carrito-menu" class="cart-menu" role="region" aria-label="Productos en el carrito" hidden>
            <h2 class="cart-menu__title">Carrito</h2>
            <ul id="carrito-lista" class="cart-menu__list"></ul>
            <p id="carrito-vacio" class="cart-menu__empty">Aún no has agregado productos</p>
            <p class="cart-menu__total"><span>Total</span> <strong id="carrito-total">Q0</strong></p>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="catalog__head">
      <h2 class="catalog__title">Catálogo</h2>
      <p id="contador" class="catalog__count" role="status"></p>
    </div>

    <div id="alerta" class="alert" role="alert" hidden>
      <svg class="alert__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <p class="alert__text">Su nombre no coincide con ningún producto</p>
    </div>

    <ul id="catalogo" class="grid"></ul>
  </main>

  <div id="aviso" class="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
